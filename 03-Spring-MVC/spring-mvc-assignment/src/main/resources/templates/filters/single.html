<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>문제 6. 필터 1개 추가</title>
</head>
<body>
    <!-- 문제 6-3: SingleFilterController가 반환하는 뷰 (filters/single) -->
    <h1>문제 6. 필터 1개 추가</h1>

    <!-- 컨트롤러에서 Model에 담은 message 값을 출력한다 -->
    <p th:text="${message}">메시지가 여기에 표시됩니다.</p>

    <!-- 화면이 아니라 IntelliJ 콘솔에서 필터 로그 순서를 확인한다 -->
    <!-- init은 서버 시작 시 1번, destroy는 서버 종료 시 1번만 찍힌다 (요청마다 찍히지 않음) -->
    <p><small>콘솔 확인: [SingleFilter] 요청 URI → 전처리 → [SingleFilterController] 실행 → [SingleFilter] 후처리 + 수행 시간(ms)</small></p>

    <a href="/filters/single">다시 요청하기</a> <small>GET /filters/single</small><br>
    <a href="/filters/multi">필터 여러 개 실습으로</a> <small>GET /filters/multi</small><br>
    <a href="/">과제 홈으로</a>
</body>
</html>
